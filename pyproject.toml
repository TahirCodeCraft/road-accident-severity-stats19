[project]
name = "road-accident-severity"
version = "0.1.0"
description = "STATS19 road accident severity prediction: ablation of feature engineering, cost-sensitive learning and calibration with a 2025 temporal holdout."
authors = [{ name = "Tahir Ahmed Khan (25I-8025)" }, { name = "Ahmed Qamar (25I-8049)" }, { name = "Ali Raza (25I-8043)" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "polars>=1.0", "pyarrow>=15", "openpyxl>=3.1",
  "scikit-learn>=1.5", "imbalanced-learn>=0.12", "xgboost==3.0.5", "lightgbm>=4.5", "catboost>=1.2",
  "optuna>=4.0", "shap>=0.46", "matplotlib>=3.8", "seaborn>=0.13",
  "hydra-core>=1.3", "omegaconf>=2.3", "tqdm>=4.66", "wandb>=0.18", "joblib>=1.4",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "statsmodels>=0.14"]
report = ["python-docx>=1.1", "python-pptx>=1.0", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]   # sys.path bootstrap must precede project imports
"src/evaluation/report_plots.py" = ["E402"]  # matplotlib backend must be set before pyplot
